# Render Blueprint: https://render.com/docs/blueprint-spec
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: pantrypilot-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: pantrypilot_ai
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODELS
        value: gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MAX_UPLOAD_MB
        value: "10"
